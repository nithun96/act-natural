<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Act Natural – a party game for a TV and everyone's phones</title>
<meta name="description" content="Act Natural is a party game for a TV and everyone's phones. Most blobs on screen are bots; the humans must finish secret tasks without moving like a human, while the Hunter tries to spot them.">
<link rel="canonical" href="https://play.nithun.no/act-natural/">
<!-- Party game for the AI workshop (Nov 2026), see BRIEF.md in the repo.
     Search engines may index this page without parameters; every URL with a query string (game screens)
     gets X-Robots-Tag: noindex from Nginx (nginx/play.nithun.no, map $play_robots).
     ?host is the TV, ?room=CODE a phone, ?host&demo=6 the TV with no network.
     Networking: direct WebRTC (PeerJS) first, the encrypted MQTT relay (relay.js) for networks that block it.
     vendor/: PeerJS and qrcode-generator (both MIT) are npm dependencies (versions in package.json); vite.config.js copies them
     into the build and serves them in `npm run dev`, so the CSP can stay script-src 'self'. -->
<style>
  :root { color-scheme: dark; --bg: #12110F; --panel: #1F1C18; --line: #3A342C; --text: #E8DFC8; --muted: #B8AE9C; --purple: #B48AE8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  canvas { display: block; }
  body > canvas { width: 100vw; height: 100vh; }
  a { color: var(--purple); }
  :focus-visible { outline: 3px solid #F0D28C; outline-offset: 3px; }

  /* TV: join panel */
  .lobby { position: fixed; top: 4vh; right: 2vw; width: clamp(220px, 20vw, 420px); padding: 1.2vw; background: rgba(18,17,15,0.92); border: 1px solid var(--line); border-radius: 12px; font-size: clamp(14px, 1vw, 22px); }
  .lobby h2 { font: 400 1.6em/1.2 Georgia, serif; margin: 0 0 0.5em; }
  .lobby h3 { font-size: 1em; margin: 1em 0 0.3em; color: var(--muted); font-weight: 600; }
  .lobby .qr { display: block; width: 100%; height: auto; border-radius: 6px; image-rendering: pixelated; }
  .lobby .code { font: 600 2.6em/1 ui-monospace, Menlo, monospace; letter-spacing: 0.15em; text-align: center; margin: 0.4em 0 0.1em; }
  .lobby .url { color: var(--muted); font-size: 0.8em; text-align: center; word-break: break-all; margin: 0; }
  .lobby ul { list-style: none; padding: 0; margin: 0; columns: 2; }
  .lobby li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lobby li.away { color: #7A7266; }
  .lobby .keys, .lobby .status { color: var(--muted); font-size: 0.8em; margin: 1em 0 0; }
  .lobby[hidden] { display: none; }

  /* TV: full-screen join view (J). Sized in vh/vw so it reads from across a room on a 1080p TV and still fits a 720p laptop */
  .joinview { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 5vw; padding: 5vh 5vw; background: var(--bg); outline: none; }
  .joinview[hidden] { display: none; }
  .joinview .jv-qr { flex: none; background: #fff; padding: 2vmin; border-radius: 1.5vmin; }
  .joinview .qr { display: block; width: min(72vh, 42vw); height: auto; image-rendering: pixelated; }
  .joinview .jv-side { flex: 1; min-width: 0; max-width: 60vw; max-height: 100%; display: flex; flex-direction: column; font-size: 3vh; }
  .joinview h2 { font: 400 1.8em/1.1 Georgia, serif; margin: 0 0 0.3em; }
  .joinview .jv-step { color: var(--muted); margin: 0; }
  .joinview .jv-url { font-size: 1.5em; font-weight: 700; line-height: 1.25; margin: 0.1em 0 0.5em; overflow-wrap: anywhere; }
  .joinview .jv-code { font: 700 4.4em/1 ui-monospace, Menlo, monospace; letter-spacing: 0.12em; margin: 0.15em 0 0; padding: 0.12em 0.2em 0.12em 0.32em; border: 0.05em solid var(--text); border-radius: 0.12em; align-self: flex-start; }
  .joinview .jv-status { color: #F0B08C; font-size: 0.75em; margin: 0.6em 0 0; }
  .joinview h3 { font-size: 1em; font-weight: 600; color: var(--muted); margin: 0.9em 0 0.3em; }
  .joinview .jv-names { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(7em, 10em)); gap: 0.1em 1em; min-height: 0; overflow: hidden; font-size: 1.1em; }
  .joinview .jv-names.many { font-size: 0.75em; line-height: 1.3; grid-template-columns: repeat(auto-fill, minmax(6em, 7.5em)); }   /* up to 20 players (round.js MAX_PLAYERS) in 5 rows */
  .joinview .jv-names li { display: flex; align-items: baseline; gap: 0.4em; min-width: 0; }
  .joinview .jv-names .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .joinview .jv-names li.away { color: #7A7266; font-style: italic; }
  .joinview .awaytag { flex: none; font: 600 0.7em system-ui, sans-serif; font-style: normal; padding: 0 0.5em; border: 1px dashed currentColor; border-radius: 1em; }
  .joinview .jv-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em 1em; margin-top: 1em; }
  .joinview .jv-foot button { font-size: 0.8em; min-height: 2.4em; }
  .joinview .next { display: flex; align-items: center; gap: 0.5em; }
  .joinview .next[disabled] { opacity: 0.5; cursor: default; }
  @media (max-aspect-ratio: 5/4) {
    .joinview { flex-direction: column; justify-content: flex-start; gap: 3vh; overflow-y: auto; }
    .joinview .qr { width: min(38vh, 80vw); }
    .joinview .jv-side { max-width: 90vw; font-size: 2.2vh; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .joinview:not([hidden]) { animation: jv-in 0.25s ease-out; }
    @keyframes jv-in { from { opacity: 0; } to { opacity: 1; } }
  }

  /* Phone */
  .phone { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
  .phone h1 { font: 400 40px/1.15 Georgia, serif; margin: 0 0 12px; }
  .phone h1 em { color: var(--purple); }
  .phone p { color: var(--muted); }
  .mono { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.1em; }
  .stack { display: grid; gap: 10px; margin: 24px 0; }
  .stack label { color: var(--text); }
  input { font: inherit; font-size: 20px; padding: 12px; min-height: 48px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  #code { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.2em; text-transform: uppercase; }
  button { font: inherit; font-weight: 600; min-height: 48px; padding: 12px 18px; border: 0; border-radius: 6px; background: var(--text); color: var(--bg); cursor: pointer; }
  .note { color: #F0B08C !important; }
  .status.big { font-size: 22px; text-align: center; margin-top: 30vh; }
  .links { margin-top: 32px; }

  /* Phone: controller fills the screen. Map on top, tasks, then the joystick area */
  .phone.playing { position: fixed; inset: 0; max-width: none; margin: 0; padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .map { display: block; width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 16 / 9; height: auto; border-radius: 8px; flex: none; }
  .tasks { flex: none; width: 100%; max-width: 560px; margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .tasks ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; flex: 1; }
  .tasks li { display: flex; align-items: center; gap: 8px; color: #7A7266; font-size: 17px; }
  .tasks li.next { color: var(--text); font-weight: 600; }
  .tasks li.done { color: var(--muted); text-decoration: line-through; }
  .tasks li.alldone { color: #F0D28C; font-weight: 600; }
  .tasks .tick { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); font-size: 13px; flex: none; }
  .tasks li.next .tick { border-color: #F0D28C; color: #F0D28C; }
  .tasks li .bar { width: 64px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .tasks li .bar span { display: block; height: 100%; width: 0; background: #F0D28C; }
  .tasks .score { margin: 0; text-align: right; color: var(--text) !important; font: 600 22px/1.2 system-ui, sans-serif; white-space: nowrap; }
  .tasks .score #score { font-size: 30px; }
  .rtt { display: block; color: #7A7266; font: 400 13px/1.4 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .pad { flex: 1; min-height: 160px; position: relative; border: 1px dashed var(--line); border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: grid; place-items: center; }
  .padhint { color: #7A7266; font-size: 18px; pointer-events: none; }
  .base { position: fixed; width: 128px; height: 128px; margin: -64px 0 0 -64px; border-radius: 50%; border: 2px solid var(--line); background: rgba(232,223,200,0.04); pointer-events: none; }
  .base[hidden] { display: none; }
  .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; border-radius: 50%; background: var(--muted); transform: translate(-50%, -50%); }

  /* TV: scores in the join panel */
  .lobby li { display: flex; justify-content: space-between; gap: 8px; padding-right: 12px; }
  .lobby .nm { overflow: hidden; text-overflow: ellipsis; }
  .lobby .pts { color: #F0D28C; font-variant-numeric: tabular-nums; }

  /* TV: round controls and scoreboard */
  .lobby .next { display: flex; width: 100%; justify-content: center; align-items: center; gap: 10px; margin-top: 1em; font-size: 1.1em; }
  .lobby .next[disabled] { opacity: 0.5; cursor: default; }
  kbd { font: 600 0.75em ui-monospace, Menlo, monospace; padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor; opacity: 0.8; }
  .lobby .why { color: var(--muted); margin: 0 0 0.6em; }
  .board { width: 100%; border-collapse: collapse; }
  .board th, .board td { text-align: left; padding: 0.3em 0.3em; border-bottom: 1px solid var(--line); }
  .board th { color: var(--muted); font-weight: 600; font-size: 0.85em; }
  .board .num { text-align: right; font-variant-numeric: tabular-nums; }
  .board tbody tr:first-child td { font-weight: 700; }
  .tag { font-size: 0.75em; padding: 1px 6px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); }

  /* Phone: round status line */
  .status-line { flex: none; width: 100%; max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 15px; }
  .status-line .clock { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .status-line .clock.low { color: #F0D28C; }
  .status-line .clock.low::before { content: "⏱ "; }

  /* Phone: Hunter */
  .map.hunt { touch-action: none; cursor: crosshair; max-width: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; width: min(100%, calc((100vh - 250px) * 16 / 9)); }
  .loupe { position: fixed; left: 0; top: 0; width: 144px; height: 144px; border-radius: 50%; border: 3px solid var(--text); box-shadow: 0 0 0 2px var(--bg), 0 6px 24px rgba(0,0,0,0.6); pointer-events: none; z-index: 5; opacity: 0; visibility: hidden; transform: scale(0.85); transition: opacity 0.12s, transform 0.12s; }
  .loupe.on { opacity: 1; visibility: visible; transform: none; }
  @media (prefers-reduced-motion: reduce) { .loupe { transition: none; transform: none; } }
  .hunter-bar .aimnote { color: var(--muted); font-size: 14px; min-height: 1.5em; }
  .hunter-bar .hint { color: #7A7266 !important; font-size: 14px; }
  .hunter-bar { flex: none; width: 100%; max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }
  .hunter-bar p { margin: 0; }
  .hunter-bar .shots { font-size: 22px; color: var(--text); letter-spacing: 0.1em; }
  .shoot { font-size: 22px; min-height: 64px; width: 100%; }
  .shoot[disabled] { opacity: 0.45; }
  .toast { color: var(--text) !important; font-weight: 600; min-height: 1.5em; }

  /* Phone: caught, results */
  .card { max-width: 480px; margin: 0 auto; padding: 24px 4px; text-align: center; }
  .card h2 { font: 400 34px/1.15 Georgia, serif; margin: 0 0 12px; }
  .card .big { font: 700 56px/1 system-ui, sans-serif; color: var(--text); margin: 8px 0; font-variant-numeric: tabular-nums; }
  .card .xeyes { font-size: 44px; margin: 0; }
  .lobby .mapline { margin: 0.8em 0 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  button.quiet { background: none; color: var(--text); border: 1px solid var(--line); font-weight: 500; min-height: 36px; padding: 4px 10px; font-size: 0.85em; }
  .lobby .kick { margin-left: auto; font: 500 0.75em system-ui, sans-serif; min-height: 28px; padding: 2px 8px; background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; }
  .lobby .kick:hover, .lobby .kick:focus-visible { color: var(--text); border-color: var(--muted); }
  .lobby li .kick { margin-left: 8px; }
  .lobby .via { font-size: 0.75em; padding: 0 5px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
  .recharge { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .recharge span { display: block; height: 100%; width: 0; background: var(--text); transition: width 0.1s linear; }
  .hunt-buttons { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  .hunt-buttons .mark, .hunt-buttons .net { min-height: 64px; font-size: 18px; }
  .hunt-buttons .net { grid-column: 1 / -1; min-height: 52px; }
  .netbanner { flex: none; width: 100%; max-width: 560px; margin: 0 auto; padding: 10px 12px; border: 2px dashed var(--text); border-radius: 8px; text-align: center; font-weight: 700; color: var(--text) !important; }
  .netbanner[hidden] { display: none; }
</style>
</head>
<body>
<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="turn.js"></script>
<script src="relay.js"></script>
<script src="net.js"></script>
<script src="maps.js"></script>
<script src="sim.js"></script>
<script src="round.js"></script>
<script src="art.js"></script>
<script src="host.js"></script>
<script src="phone.js"></script>
</body>
</html>
